name: ci
on:
  push:
  schedule:
    - cron: "0 */24 * * *"
jobs:
  build_x86:
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      BUILD_TYPE: ${{matrix.build_type}}
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        python3 -m pip install --upgrade pip
        pip3 install pyoai 'oaipmh-scythe==0.14.0'

    - name: Get papers
      run: |
        python3 code/get.py > data.txt

    - name: Generate pages
      run: |
        bash code/run.sh

    - name: Push
      run: (git -c user.name='Xiao Wang' -c user.email='no@email.com' add *.html || true) && (git -c user.name='Xiao Wang' -c user.email='no@email.com' commit -am"daily update" || true) && git push
